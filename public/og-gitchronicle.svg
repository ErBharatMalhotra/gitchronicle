<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="GitChronicle — Real-Time Developer Intelligence & Percentile Benchmark">
  <rect width="1200" height="630" fill="#090d16"/>
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#f59e0b" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="cadenceGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#f59e0b" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#cadenceGrid)"/>
  
  <!-- Accent lines -->
  <line x1="120" y1="280" x2="1080" y2="280" stroke="#1e293b" stroke-width="1" stroke-dasharray="8,12"/>

  <!-- Hero: Cadence Rhythm Matrix visualization -->
  <g transform="translate(140, 160)" filter="url(#goldGlow)">
    <!-- 7x24 grid representation -->
    <g fill="url(#goldGrad)">
      <!-- Row 1 (Mon) -->
      <rect x="0" y="0" width="12" height="12" rx="2" opacity="0.3"/>
      <rect x="18" y="0" width="12" height="12" rx="2" opacity="0.6"/>
      <rect x="36" y="0" width="12" height="12" rx="2" opacity="0.9"/>
      <rect x="54" y="0" width="12" height="12" rx="2" opacity="0.4"/>
      <rect x="72" y="0" width="12" height="12" rx="2" opacity="0.8"/>
      <rect x="90" y="0" width="12" height="12" rx="2" opacity="0.2"/>
      <rect x="108" y="0" width="12" height="12" rx="2" opacity="0.7"/>
      <rect x="126" y="0" width="12" height="12" rx="2" opacity="0.5"/>
      <rect x="144" y="0" width="12" height="12" rx="2" opacity="0.9"/>
      <rect x="162" y="0" width="12" height="12" rx="2" opacity="0.3"/>
      <rect x="180" y="0" width="12" height="12" rx="2" opacity="0.6"/>
      <rect x="198" y="0" width="12" height="12" rx="2" opacity="0.8"/>
      <rect x="216" y="0" width="12" height="12" rx="2" opacity="0.4"/>
      <rect x="234" y="0" width="12" height="12" rx="2" opacity="0.9"/>
      <rect x="252" y="0" width="12" height="12" rx="2" opacity="0.2"/>
      <rect x="270" y="0" width="12" height="12" rx="2" opacity="0.7"/>
      <rect x="288" y="0" width="12" height="12" rx="2" opacity="0.5"/>
      <rect x="306" y="0" width="12" height="12" rx="2" opacity="0.9"/>
      <rect x="324" y="0" width="12" height="12" rx="2" opacity="0.3"/>
      <rect x="342" y="0" width="12" height="12" rx="2" opacity="0.6"/>
      <rect x="360" y="0" width="12" height="12" rx="2" opacity="0.8"/>
      <rect x="378" y="0" width="12" height="12" rx="2" opacity="0.4"/>
      <rect x="396" y="0" width="12" height="12" rx="2" opacity="0.9"/>
      <rect x="414" y="0" width="12" height="12" rx="2" opacity="0.2"/>
      <rect x="432" y="0" width="12" height="12" rx="2" opacity="0.7"/>
      
      <!-- Row 2 (Tue) - shifted pattern -->
      <rect x="0" y="20" width="12" height="12" rx="2" opacity="0.8"/>
      <rect x="18" y="20" width="12" height="12" rx="2" opacity="0.4"/>
      <rect x="36" y="20" width="12" height="12" rx="2" opacity="0.9"/>
      <rect x="54" y="20" width="12" height="12" rx="2" opacity="0.3"/>
      <rect x="72" y="20" width="12" height="12" rx="2" opacity="0.7"/>
      <rect x="90" y="20" width="12" height="12" rx="2" opacity="0.5"/>
      <rect x="108" y="20" width="12" height="12" rx="2" opacity="0.2"/>
      <rect x="126" y="20" width="12" height="12" rx="2" opacity="0.6"/>
      <rect x="144" y="20" width="12" height="12" rx="2" opacity="0.9"/>
      <rect x="162" y="20" width="12" height="12" rx="2" opacity="0.4"/>
      <rect x="180" y="20" width="12" height="12" rx="2" opacity="0.8"/>
      <rect x="198" y="20" width="12" height="12" rx="2" opacity="0.5"/>
      <rect x="216" y="20" width="12" height="12" rx="2" opacity="0.9"/>
      <rect x="234" y="20" width="12" height="12" rx="2" opacity="0.3"/>
      <rect x="252" y="20" width="12" height="12" rx="2" opacity="0.7"/>
      <rect x="270" y="20" width="12" height="12" rx="2" opacity="0.6"/>
      <rect x="288" y="20" width="12" height="12" rx="2" opacity="0.4"/>
      <rect x="306" y="20" width="12" height="12" rx="2" opacity="0.9"/>
      <rect x="324" y="20" width="12" height="12" rx="2" opacity="0.2"/>
      <rect x="342" y="20" width="12" height="12" rx="2" opacity="0.8"/>
      <rect x="360" y="20" width="12" height="12" rx="2" opacity="0.5"/>
      <rect x="378" y="20" width="12" height="12" rx="2" opacity="0.9"/>
      <rect x="396" y="20" width="12" height="12" rx="2" opacity="0.4"/>
      <rect x="414" y="20" width="12" height="12" rx="2" opacity="0.6"/>
      <rect x="432" y="20" width="12" height="12" rx="2" opacity="0.9"/>
      
      <!-- Rows 3-7 (Wed-Sun) - abbreviated -->
      <g opacity="0.6">
        <rect x="0" y="40" width="444" height="10" rx="2" fill="url(#goldGrad)"/>
        <rect x="0" y="60" width="444" height="10" rx="2" fill="url(#goldGrad)"/>
        <rect x="0" y="80" width="444" height="10" rx="2" fill="url(#goldGrad)"/>
        <rect x="0" y="100" width="444" height="10" rx="2" fill="url(#goldGrad)"/>
        <rect x="0" y="120" width="444" height="10" rx="2" fill="url(#goldGrad)"/>
      </g>
    </g>
  </g>

  <!-- Percentile rings on the right -->
  <g transform="translate(700, 200)" filter="url(#goldGlow)">
    <g>
      <circle r="80" fill="none" stroke="#1e293b" stroke-width="8"/>
      <circle r="80" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="502.65" stroke-dashoffset="5" stroke-linecap="round">
        <animate attributeName="stroke-dashoffset" values="502.65;5" dur="2s" easing="ease-out"/>
      </circle>
      <text x="0" y="8" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="32" fill="url(#goldGrad)">99</text>
      <text x="0" y="32" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#fbbf24" letter-spacing="2">TH PERCENTILE</text>
    </g>
    <g transform="translate(180, 0)">
      <circle r="60" fill="none" stroke="#1e293b" stroke-width="6"/>
      <circle r="60" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="376.99" stroke-dashoffset="50" stroke-linecap="round"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="24" fill="url(#goldGrad)">94</text>
      <text x="0" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fbbf24" letter-spacing="1">TH PERCENTILE</text>
    </g>
    <g transform="translate(-180, 0)">
      <circle r="60" fill="none" stroke="#1e293b" stroke-width="6"/>
      <circle r="60" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="376.99" stroke-dashoffset="80" stroke-linecap="round"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="24" fill="url(#goldGrad)">87</text>
      <text x="0" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#fbbf24" letter-spacing="1">TH PERCENTILE</text>
    </g>
  </g>

  <!-- Typography -->
  <text x="450" y="240" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="56" fill="#f1f5f9" letter-spacing="-1">
    <tspan fill="#f59e0b">Git</tspan><tspan fill="#fbbf24">Chronicle</tspan>
  </text>
  
  <text x="450" y="300" font-family="'JetBrains Mono', monospace" font-size="16" fill="#94a3b8" letter-spacing="4" text-transform="uppercase">
    Real-Time Developer Intelligence
  </text>

  <!-- Features -->
  <g font-family="'JetBrains Mono', monospace" font-size="13" fill="#94a3b8" transform="translate(450, 360)">
    <g transform="translate(-220, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="8" fill="#0b101c" stroke="#f59e0b" stroke-width="1" opacity="0.8"/>
      <text x="0" y="5" text-anchor="middle" fill="#f59e0b">Percentile Benchmarks</text>
    </g>
    <g transform="translate(0, 0)">
      <rect x="-110" y="-18" width="220" height="36" rx="8" fill="#0b101c" stroke="#fbbf24" stroke-width="1" opacity="0.8"/>
      <text x="0" y="5" text-anchor="middle" fill="#fbbf24">7×24 Cadence Matrix</text>
    </g>
    <g transform="translate(220, 0)">
      <rect x="-100" y="-18" width="200" height="36" rx="8" fill="#0b101c" stroke="#fde047" stroke-width="1" opacity="0.8"/>
      <text x="0" y="5" text-anchor="middle" fill="#fde047">Repo Health Audit</text>
    </g>
  </g>

  <!-- Ecosystem -->
  <g font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" transform="translate(450, 430)">
    <text x="-280" y="0" text-anchor="end">Ecosystem:</text>
    <g transform="translate(-150, -4)">
      <circle cx="0" cy="6" r="6" fill="#00f5ff" opacity="0.2"/>
      <text x="16" y="10" fill="#00f5ff">GitHolo</text>
      <text x="16" y="24" fill="#64748b" font-size="10">githolo.bharatdn.com</text>
    </g>
    <g transform="translate(200, -4)">
      <circle cx="0" cy="6" r="6" fill="#10b981" opacity="0.2"/>
      <text x="16" y="10" fill="#10b981">ReadmeCraft</text>
      <text x="16" y="24" fill="#64748b" font-size="10">readme.bharatdn.com</text>
    </g>
  </g>

  <!-- Domain badge -->
  <g transform="translate(450, 510)">
    <rect x="-180" y="-18" width="360" height="46" rx="10" fill="#0b101c" stroke="url(#goldGrad)" stroke-width="2"/>
    <text x="0" y="8" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="600" font-size="18" fill="url(#goldGrad)">
      gitchronicle.bharatdn.com
    </text>
  </g>

  <!-- Author -->
  <text x="1080" y="600" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#334155">
    Built by ErBharatMalhotra
  </text>
</svg>