<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GitChronicle">
  <!-- Deep obsidian background -->
  <rect width="512" height="512" rx="64" fill="#090d16"/>
  <!-- Amber/gold border -->
  <rect x="2" y="2" width="508" height="508" rx="62" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  
  <defs>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <radialGradient id="pulseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="goldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#f59e0b" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="cadenceGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#f59e0b" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Main symbol: Cadence rhythm matrix / pulse wave -->
  <g transform="translate(256, 256)" filter="url(#goldGlow)">
    <!-- Outer percentile ring -->
    <circle r="100" fill="none" stroke="url(#goldFill)" stroke-width="3" stroke-dasharray="628.3" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" values="628.3;0" dur="2s" repeatCount="indefinite" easing="ease-out"/>
    </circle>
    
    <!-- Inner percentile markers (12 positions like clock) -->
    <g stroke="url(#goldFill)" stroke-width="2" stroke-linecap="round">
      <g transform="rotate(-90)">
        <line x1="85" y1="0" x2="95" y2="0" opacity="0.9"/>
        <line x1="85" y1="0" x2="95" y2="0" opacity="0.7" transform="rotate(30)"/>
        <line x1="85" y1="0" x2="95" y2="0" opacity="0.5" transform="rotate(60)"/>
        <line x1="85" y1="0" x2="95" y2="0" opacity="0.9" transform="rotate(90)"/>
        <line x1="85" y1="0" x2="95" y2="0" opacity="0.7" transform="rotate(120)"/>
        <line x1="85" y1="0" x2="95" y2="0" opacity="0.5" transform="rotate(150)"/>
        <line x1="85" y1="0" x2="95" y2="0" opacity="0.9" transform="rotate(180)"/>
        <line x1="85" y1="0" x2="95" y2="0" opacity="0.7" transform="rotate(210)"/>
        <line x1="85" y1="0" x2="95" y2="0" opacity="0.5" transform="rotate(240)"/>
        <line x1="85" y1="0" x2="95" y2="0" opacity="0.9" transform="rotate(270)"/>
        <line x1="85" y1="0" x2="95" y2="0" opacity="0.7" transform="rotate(300)"/>
        <line x1="85" y1="0" x2="95" y2="0" opacity="0.5" transform="rotate(330)"/>
      </g>
    </g>
    
    <!-- Cadence wave / pulse line -->
    <path 
      d="M -80 0 
         Q -60 -30 -40 0 
         T 0 0 
         T 40 0 
         T 80 0" 
      fill="none" 
      stroke="url(#goldFill)" 
      stroke-width="4" 
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#goldGlow)">
      <animate attributeName="d" 
        values="
          M -80 0 Q -60 -30 -40 0 T 0 0 T 40 0 T 80 0;
          M -80 0 Q -60 20 -40 0 T 0 0 T 40 0 T 80 0;
          M -80 0 Q -60 -30 -40 0 T 0 0 T 40 0 T 80 0"
        dur="1.5s" 
        repeatCount="indefinite"/>
    </path>
    
    <!-- Center percentile badge -->
    <circle r="28" fill="#090d16" stroke="url(#goldFill)" stroke-width="3"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="18" fill="url(#goldFill)">99</text>
    <text x="0" y="26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="7" fill="#fbbf24" letter-spacing="1">TH</text>
    
    <!-- Pulsing ring -->
    <circle r="35" fill="none" stroke="url(#goldFill)" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="35;55;35" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Typography: "GitChronicle" -->
  <text x="256" y="415" text-anchor="middle" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-weight="700" font-size="32" fill="#f1f5f9" letter-spacing="0.5">
    <tspan fill="#f59e0b">Git</tspan><tspan fill="#fbbf24">Chronicle</tspan>
  </text>

  <!-- Subtle tagline -->
  <text x="256" y="458" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" letter-spacing="3" text-transform="uppercase">
    Developer Intelligence
  </text>
</svg>