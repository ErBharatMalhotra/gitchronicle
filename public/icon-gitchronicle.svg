<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="GitChronicle">
  <rect width="32" height="32" rx="4" fill="#090d16"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="3.5" fill="none" stroke="url(#b)" stroke-width="1"/>
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="32" y2="32">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>
  <g transform="translate(16, 16)">
    <!-- Percentile ring -->
    <circle r="11" fill="none" stroke="url(#b)" stroke-width="2" stroke-dasharray="69.1" stroke-dashoffset="0"/>
    <!-- Pulse wave -->
    <path d="M -9 0 Q -7 -4 -4 0 T 4 0 T 9 0" fill="none" stroke="url(#b)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Center badge -->
    <circle r="4" fill="#090d16" stroke="url(#b)" stroke-width="1.5"/>
    <text x="0" y="2.5" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="4" fill="url(#b)">99</text>
